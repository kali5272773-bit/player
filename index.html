<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08080d">
<title>TRUST ME BRO — Ultimate Troll Edition 😂</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="noise"></div><div class="orb o1"></div><div class="orb o2"></div>
<main>
<header>
  <div><div class="brand">TRUST <em>ME</em> BRO</div><div class="sub">ULTIMATE TROLL EDITION • 2026</div></div>
  <div class="hud"><span>LEVEL <b id="lvl">1</b></span><span>🪙 <b id="coins">0</b></span></div>
</header>
<section class="panel">
  <div class="topline"><span id="tag">BOOTING CHAOS</span><span id="hearts">❤️❤️❤️</span></div>
  <div class="bar"><i id="progress"></i></div>
  <div id="content"></div>
</section>
<section class="mini"><b>⚠️ WARNING</b> This game is not responsible for your decisions. <span id="hint">Trust nothing.</span></section>
</main>
<div id="toast"></div>
<script src="game.js"></script>
</body>
</html>
